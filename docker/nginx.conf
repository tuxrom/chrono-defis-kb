server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/manifest+json image/svg+xml;

    # Le SW et le manifest ne doivent jamais être servis périmés.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }
    location /icons/ { add_header Cache-Control "public, max-age=604800"; }

    location / { try_files $uri $uri/ /index.html; }
}
